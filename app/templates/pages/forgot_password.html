<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/forgot_password.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <title>FlavorFlow - Forgot Password</title>
</head>

<body>
    <div class="container">

        <!-- Left Side: Hero Image -->
        <div class="hero-image">
            <div class="hero-bg"
                style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBiJ5qPG3bznIW9ypGIZq9YbuQ4kbfDonDGkC0CS-k6rKPJXoxgCZ5boyCZsA-X-HbkxVbWLSIn5RzRemyJJJgsLUNgACPP2gJj_4Bv7nHf0HKquecq3UvPJ-z_F2036kxxpF39Znvl32oItch3U5OGi5pGvj3CoHieuE7rELjq93XJF7S-rQb3V9yNPh7elt5JFEuRvwaomSARAOh9McbHYOSZA99wrb02S7b0JF69kYmew9N8aJFan0vxo8vYSdad6_dUzWdk2iM');">
            </div>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-logo">
                    <div class="hero-icon">
                        <span class="material-symbols-outlined">restaurant_menu</span>
                    </div>
                    <h1>FlavorFlow</h1>
                </div>
                <p>Streamlining the world's kitchens, one recipe at a time.</p>
            </div>
        </div>

        <!-- Right Side: Reset Form -->
        <div class="form-container">
            <!-- Mobile Logo -->
            <div class="mobile-logo">
                <div class="hero-icon">
                    <span class="material-symbols-outlined">restaurant_menu</span>
                </div>
                <h2>FlavorFlow</h2>
            </div>

            <div class="form-box">
                <!-- Title -->
                <div class="form-title">
                    <h1>Forgot Password</h1>
                    <p>Enter your email address and we'll send you a code to reset your password.</p>
                </div>

                <!-- Form -->
                <form action="/forgot-password" method="post" class="reset-form">
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined icon">mail </span>
                            <input type="email" name="email" id="email" placeholder="e.g. chef@flavorflow.com" />
                        </div>
                    </div>

                    <button type="submit">
                        <span>Send Reset Code</span>
                        <span class="material-symbols-outlined arrow">arrow_forward</span>
                    </button>
                </form>

                <!-- Back to Login -->
                <div class="back-login">
                    <a href="/">
                        <span class="material-symbols-outlined">arrow_back</span>
                        <span>Back to Login</span>
                    </a>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                © 2024 FlavorFlow Culinary Systems
            </div>
        </div>

    </div>
</body>

</html>
