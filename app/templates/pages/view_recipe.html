{% extends "base/base.html" %}

{% block title %}{{ recipe.title }} | FlavorFlow{% endblock %}

{% block content %}

<link rel="stylesheet" href="/static/css/view_recipe.css">

<div class="recipe-view-container">

    <div class="recipe-header">
        <h1>{{ recipe.title }}</h1>
        <p>{{ recipe.description }}</p>
    </div>

    <div class="pdf-wrapper">
        <embed src="{{ recipe.file_path }}" type="application/pdf" />
    </div>

    <div class="actions">
        <a href="{{ recipe.file_path }}" download class="btn-primary">
            Download PDF
        </a>
    </div>

</div>

{% endblock %}
