<nav class="sidebar">
    <div class="sidebar-header">
        <h1>FlavorFlow</h1>
        <p>Management Suite</p>
    </div>
    <ul class="sidebar-links">
        <a href="/admin-dashboard"><i class="fi fi-rr-square-poll-vertical"></i> Dashboard</a>
        <a href="/messages" class="active"><i class="fi fi-rr-envelope"></i> Inquiries</a>
        <a href="/share-recipe"><i class="fi fi-rr-share"></i> Share Recipe</a>
        <a href="/user-manage"><i class="fi fi-rr-user-gear"></i> User Management</a>
        <a href="/ingredient-manage"><i class="fi fi-rr-recipe"></i> Ingredient Management</a>
        <a href="/profile"><i class="fi fi-rr-user-pen"></i>Profile</a>
    </ul>
    <a href="/authenticate" class="logout-btn">
        <button class="log-btn"><i class="fi fi-rc-leave"></i>Logout</button></a>
</nav>

<script>
    // Get the current path (e.g., "/index", "/aboutus", etc.)
    const currentPath = window.location.pathname;

    // Select all sidebar links
    const navLinks = document.querySelectorAll('.sidebar-links a');

    // Loop through links
    navLinks.forEach(link => {
        // Remove active class from all links first
        link.classList.remove('active');

        // Add active class if href matches current path
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
        }

        // Add click listener to update active dynamically
        link.addEventListener('click', () => {
            navLinks.forEach(l => l.classList.remove('active')); // remove from all
            link.classList.add('active'); // add to clicked
        });
    });
</script>
