<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="/static/css/authenticate.css" />
    
</head>

<body class="container">
    <div class="auth" id="auth">
        <div id="left-panel">
            <div id="login" class="panel-content">
                <h2 style="margin-top: 50px;">Welcome Cooks</h2>
                <form class="log-input" id="login-form" action="/login" method="POST">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>

                <p>Don't have an account?
                    <span onclick="showSignup()">Sign Up</span>
                </p>
            </div>
            <div id="ff-left" class="panel-content">
                <div style="display: flex; margin-top: 30px;">
                    <div class="logo">
                        <img src="/static/images/logo.png">
                    </div>
                    <div class="name">
                        <h1>FLAVORFLOW</h1>
                        <p>RECIPES FLOWING AT YOUR FINGERTIPS</p>
                    </div>
                </div>
                <div class="register-img">
                    <img src="/static/images/auth-r.png">
                </div>
            </div>
        </div>
        <div id="right-panel">
            <div id="ff-right" class="panel-content">
                <div style="display: flex; margin-top: 30px;">
                    <div class="logo">
                        <img src="/static/images/logo.png">
                    </div>
                    <div class="name">
                        <h1>FLAVORFLOW</h1>
                        <p>RECIPES FLOWING AT YOUR FINGERTIPS</p>
                    </div>
                </div>
                <div class="login-img">
                    <img src="/static/images/auth-l.png">
                </div>
            </div>
            <div id="signup" class="panel-content">
                <h2 style="margin-top: 50px;">Create Account</h2>
                <form class="sign-input" id="signup-form" action="/signup" method="POST">
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="tel" name="phonenumber" placeholder="Phone Number" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>
                <p>Already have an account?
                    <span onclick="showLogin()">Login</span>
                </p>
            </div>
        </div>


    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.showSignup = function () {
                document.getElementById("auth").classList.add("signup-mode");
            };

            window.showLogin = function () {
                document.getElementById("auth").classList.remove("signup-mode");
            };
        });
    </script>

</body>

</html>
