<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
</head>

<body class="container">
    <div class="auth" id="auth">
        <div id="left-panel">
            <div id="login" class="panel-content">
                <h2 style="margin-top: 50px;">Welcome Cooks</h2>
                <form class="log-input">
                    <input type="text" placeholder="Username">
                    <input type="password" placeholder="Password">
                    <button>Login</button>
                </form>
                <p>Don't have an account?
                    <span onclick="showSignup()">Sign Up</span>
                </p>
            </div>
            <div id="ff-left" class="panel-content">
                <div style="display: flex; margin-top: 30px;">
                    <div class="logo">
                        <img src="../images/logo.png">
                    </div>
                    <div class="name">
                        <h1>FLAVORFLOW</h1>
                        <p>RECIPES FLOWING AT YOUR FINGERTIPS</p>
                    </div>
                </div>
                <div class="register-img">
                    <img src="../images/auth-r.png">
                </div>
            </div>
        </div>
        <div id="right-panel">
            <div id="ff-right" class="panel-content">
                <div style="display: flex; margin-top: 30px;">
                    <div class="logo">
                        <img src="../images/logo.png">
                    </div>
                    <div class="name">
                        <h1>FLAVORFLOW</h1>
                        <p>RECIPES FLOWING AT YOUR FINGERTIPS</p>
                    </div>
                </div>
                <div class="login-img">
                    <img src="../images/auth-l.png">
                </div>
            </div>
            <div id="signup" class="panel-content">
                <h2 style="margin-top: 50px;">Create Account</h2>
                <form class="sign-input">
                    <input type="email" placeholder="Email">
                    <input type="text" placeholder="Username">
                    <input type="tel" placeholder="Phone Number">
                    <input type="password" placeholder="Password">
                    <input type="password" placeholder="Confirm Password">
                    <button>Sign Up</button>
                </form>
                <p>Already have an account?
                    <span onclick="showLogin()">Login</span>
                </p>
            </div>
        </div>


    </div>

    <div id="auth"> ... </div>
    <script src="auth.js">
    </script>
</body>

</html>
